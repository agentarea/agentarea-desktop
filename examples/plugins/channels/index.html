    $('gapKpis').innerHTML = reqs.map((r) => {
      const free = candidates(r.type, null).length;
      return `<div class="kpi click${r.id === gapReq ? ' on' : ''}" data-r="${r.id}"><div class="lbl tl">${TYPE_IC[r.type] || TYPE_IC.other}${esc(TYPE_NAME[r.type] || r.type)} · ${esc(r.purpose)}</div>
        <div class="big num ${r.missing_count ? 'wc' : 'okc'}">${r.missing_count ? r.missing_count : '✓'}<small>${r.missing_count ? `of ${r.total} ${r.scope}s missing` : `all ${r.total} ${r.scope}s covered`}</small></div>
        <div class="sub num"><span>${r.count > 1 ? `${r.count} per ` : 'per '}${esc(r.scope)}${r.platform !== '*' ? ` · ${esc(CH.platformName(r.platform))}` : ''}${r.geo_match ? ' · same country' : ''}</span><span>${free} free</span></div></div>`;
    }).join('') + `<div class="kpi"><div class="lbl">Warnings</div><div class="big num ${w.length ? 'wc' : ''}">${w.length}</div><div class="sub num"><span>${count('geo_mismatch')} geo mismatch</span><span>${count('capacity')} over capacity</span><span>${count('bad_status')} broken/retired bound</span></div></div>`;
    $('gapKpis').querySelectorAll('.kpi.click').forEach((k) => { k.onclick = () => { gapReq = +k.dataset.r; render(); }; });
  }
  function renderGaps() {
    renderGapKpis();
    const g = data.gaps || { requirements: [], warnings: [] };
    const r = (g.requirements || []).find((x) => x.id === gapReq);
    const miss = r ? r.missing : [];
    const countries = [...new Set(miss.map((m) => m.country).filter(Boolean))].sort();
    const cats = [...new Set(miss.map((m) => m.category).filter(Boolean))].sort();
    $('gCountry').innerHTML = '<option value="all">All countries</option>' + countries.map((c) => `<option value="${esc(c)}" ${GF.country === c ? 'selected' : ''}>${CH.flag(c)} ${esc(c)} · ${miss.filter((m) => m.country === c).length}</option>`).join('');
    $('gCat').innerHTML = '<option value="all">All categories</option>' + cats.map((c) => `<option ${GF.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('');
    const rows = miss.filter((m) => (GF.country === 'all' || m.country === GF.country) && (GF.cat === 'all' || m.category === GF.cat)
      && (!GF.q || GF.q.split(/\s+/).every((w) => [m.label, m.persona, m.city, m.category, (personaById(m.persona) || {}).name, (personaById(m.persona) || {}).niche].join(' ').toLowerCase().includes(w))));
    $('gShown').textContent = r ? `${rows.length} of ${miss.length} missing` : '';
    const free = r ? candidates(r.type, null).length : 0;
    $('gAuto').hidden = !canWrite() || !r || !r.missing_count;
    $('gAuto').disabled = !free;
    $('gAuto').title = free ? `Bind free ${TYPE_NAME[r.type] || ''} items to the missing ${r.scope}s${r.geo_match ? ' (same country only)' : ''}, least-used first` : 'No free items of this type — add some in Inventory';
    const warns = g.warnings || [];
    const wHtml = warns.length ? `<div class="warns"><div class="wh">⚠ ${warns.length} warning${warns.length > 1 ? 's' : ''}</div>${warns.slice(0, 50).map((w) => `<div class="wr"><span class="kind">${esc(w.kind.replace('_', ' '))}</span><span style="flex:1">${esc(w.message)}</span>${w.item_id ? `<button class="btn sm" data-item="${w.item_id}">Open item</button>` : ''}${canWrite() && w.binding_id ? `<button class="btn sm" data-unbind="${w.binding_id}">Unbind</button>` : ''}</div>`).join('')}</div>` : '';
    let body;
    if (!r) body = '<div class="empty">No requirements. Agents add them with requirement_add (see SCHEMA.md).</div>';
    else if (!r.missing_count) body = `<div class="empty">Every ${esc(r.scope)} has its ${esc(TYPE_NAME[r.type] || r.type)} (${esc(r.purpose)}). ✓</div>`;
    else {
      const persona = r.scope === 'persona';
      const tr = (m) => {
        const p = personaById(m.persona) || {};
        const cands = candidates(r.type, r.geo_match ? m.country : null, m.platform).filter((c) => !r.geo_match || c.match >= 0).slice(0, 40);
        return `<tr><td><div class="ti"><span class="ava" style="width:24px;height:24px;font-size:13px">${esc(m.emoji || p.emoji || '👤')}</span><span><b class="chip0" data-p="${esc(m.persona)}" data-pl="${esc(persona ? '' : m.platform || '')}" style="cursor:pointer">${esc(m.label)}</b><span class="s2">${esc([p.name, p.niche].filter(Boolean).join(' · '))}</span></span></div></td>
          <td>${esc(`${CH.flag(m.country)} ${m.country || '—'}`)}</td><td>${esc(m.city || '—')}</td><td class="muted2">${esc(m.category || '')}</td><td class="num">${m.have}/${m.need}</td>
          <td>${canWrite() ? (cands.length ? `<div class="gsel"><select data-s="${esc(m.subject_type)}:${esc(m.subject_id)}">${cands.map((c) => `<option value="${c.i.id}">${esc(candLabel(c))}</option>`).join('')}</select><button class="btn sm" data-bind="${esc(m.subject_type)}:${esc(m.subject_id)}">Bind</button></div>` : `<span class="muted2">no free ${esc(TYPE_NAME[r.type] || r.type)}${r.geo_match && m.country ? ` in ${esc(m.country)}` : ''}</span>`) : ''}</td></tr>`;
      };
      body = `<table class="it"><thead><tr><th>${persona ? 'Persona' : 'Channel'}</th><th>Country</th><th>City</th><th>Category</th><th>Has</th><th>${canWrite() ? 'Quick bind' : ''}</th></tr></thead><tbody>${rows.map(tr).join('') || '<tr><td colspan="6" class="empty">Nothing matches the filters.</td></tr>'}</tbody></table>`;
    }
    const old = $('view').querySelector('.ivw'); const top = old ? old.scrollTop : 0;
    $('view').innerHTML = `<div class="ivw">${wHtml}${body}</div>`;
    const v = $('view').querySelector('.ivw'); v.scrollTop = top;
    v.onclick = async (e) => {
      const who = e.target.closest('[data-p]');
      if (who && who.classList.contains('chip0')) return gotoSubject(who.dataset.p, who.dataset.pl || null);
      const it = e.target.closest('[data-item]');
      if (it) { tab = 'inventory'; store.set('channels.tab', tab); invSel = { kind: 'item', id: +it.dataset.item }; render(); return openInv(); }
      const ub = e.target.closest('[data-unbind]');
      if (ub) return mutate('inventory_unbind', { binding_id: +ub.dataset.unbind }).catch(() => {});
      const b = e.target.closest('[data-bind]');
      if (b) {
        const [st, ...rest] = b.dataset.bind.split(':'); const sid = rest.join(':');
        const selEl = v.querySelector(`select[data-s="${CSS.escape(b.dataset.bind)}"]`);
        b.disabled = true;
        await mutate('inventory_bind', { item_id: +selEl.value, subject_type: st, subject_id: sid, purpose: r.purpose }).catch(() => { b.disabled = false; });
      }
    };
  }

  // ── bound inventory in the persona / channel panels
  function invSection(p, c) {
    const own = c ? c.inventory : p.inventory;
    const inherited = c ? p.inventory : [];
    const missing = c ? [...new Set([...p.gaps, ...c.gaps])] : p.gaps;
    const row = (x, via) => `<div class="ir">${TYPE_IC[x.type] || TYPE_IC.other}<div><div>${esc(x.label)}${x.provider ? ` <span class="m">· ${esc(x.provider)}</span>` : ''}</div><div class="m">${esc([TYPE_NAME[x.type], x.purpose, x.geo && `${CH.flag(geoCC(x.geo))} ${x.geo}`, x.ip, via].filter(Boolean).join(' · '))}${x.status !== 'active' ? ` · <span class="${x.status === 'broken' ? 'bc' : ''}">${esc(x.status)}</span>` : ''}${x.type === 'proxy' && p.country && geoCC(x.geo) && geoCC(x.geo) !== String(p.country).toUpperCase() ? ' · <span class="wc">⚠ not in ' + esc(p.country) + '</span>' : ''}${x.secret_ref ? ` · ${x.secret === 'ok' ? '<span class="okc">🔑 ' + esc(x.secret_ref) + '</span>' : '<span class="wc">⚠ ' + esc(x.secret_ref) + ' missing</span>'}` : ''}</div></div>${via ? '' : canWrite() ? `<button class="xb" data-unbind="${x.binding}" title="Unbind">×</button>` : ''}</div>`;
    // On a persona: also what its channels hold (accounts, per-channel keys), with unbind.
    const perChannel = c ? [] : p.channels.flatMap((ch) => ch.inventory.map((x) => ({ ...x, on: CH.platformName(ch.platform) })));
    const rows = own.map((x) => row(x, '')).concat(inherited.map((x) => row(x, 'via persona'))).concat(perChannel.map((x) => row({ ...x, purpose: `${x.purpose} on ${x.on}` }, ''))).join('');
    const types = [...new Set([...missing, ...TYPES])].filter((t) => c || t !== 'account');
    return `<div class="sec" id="invSec"><h3>Inventory ${missing.length ? `<span class="gb" title="Required but missing">⚠ missing ${esc(missing.map((t) => TYPE_NAME[t] || t).join(', '))}</span>` : own.length || inherited.length ? '<span class="gb okb">✓ complete</span>' : ''}<span class="r num">${own.length + inherited.length + perChannel.length} bound</span></h3>
      ${rows ? `<div class="rows">${rows}</div>` : '<div class="note">Nothing bound yet.</div>'}
      ${canWrite() ? `<div style="margin-top:8px"><button class="btn sm" id="attach">+ Attach inventory</button></div>
      <div class="box" id="attachBox" hidden><div class="form">
        <label for="aType">Type</label><select id="aType">${types.map((t) => `<option value="${t}">${esc(TYPE_NAME[t])}${missing.includes(t) ? ' — missing' : ''}</option>`).join('')}</select>
        <label for="aItem">Item</label><select id="aItem"></select>
        <label for="aPurpose">Purpose</label><select id="aPurpose">${PURPOSES.map((x) => `<option>${x}</option>`).join('')}</select>
        ${c ? `<label for="aFor">For</label><select id="aFor"><option value="persona">the persona (all its channels)</option><option value="channel">this ${esc(CH.platformName(c.platform))} channel only</option></select>` : ''}
        <span></span><div class="inl"><button class="btn primary sm" id="aGo">Bind</button><span class="msg" id="aMsg"></span></div></div></div>` : ''}</div>`;
  }
  function wireInvSection(p, c) {
    panel.querySelectorAll('#invSec [data-unbind]').forEach((b) => { b.onclick = () => mutate('inventory_unbind', { binding_id: +b.dataset.unbind }, $('msg')).catch(() => {}); });
    if (!$('attach')) return;
    const country = String(p.country || '').toUpperCase();
    const fillItems = () => {
      const t = $('aType').value;
      const cs = candidates(t, country, c && c.platform);
      $('aItem').innerHTML = cs.length ? cs.slice(0, 80).map((x) => `<option value="${x.i.id}">${esc(candLabel(x))}</option>`).join('') : `<option value="">No free ${esc(TYPE_NAME[t])} — add one in Inventory</option>`;
      $('aPurpose').value = DEF_PURPOSE[t] || 'other';
      if ($('aFor')) { $('aFor').value = t === 'api_key' || t === 'account' ? 'channel' : 'persona'; $('aFor').disabled = t === 'account'; }
    };
    $('attach').onclick = () => { $('attachBox').hidden = !$('attachBox').hidden; if (!$('attachBox').hidden) fillItems(); };
    $('aType').onchange = fillItems;
    $('aGo').onclick = () => {
      if (!$('aItem').value) return;
      const forChannel = c && $('aFor').value === 'channel';
      mutate('inventory_bind', { item_id: +$('aItem').value, subject_type: forChannel ? 'channel' : 'persona', subject_id: forChannel ? String(c.id) : p.id, purpose: $('aPurpose').value }, $('aMsg')).catch(() => {});
    };
  }

  // ── events
  function setHash() { if (!sel) return; history.replaceState(null, '', sel.kind === 'p' ? `#p=${encodeURIComponent(sel.id)}` : `#c=${encodeURIComponent(sel.id)}:${encodeURIComponent(sel.platform)}`); }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (sel || invSel) && !e.target.closest('input, textarea, select')) close(); });
  $('tabSeg').onclick = (e) => { const b = e.target.closest('button'); if (!b || b.dataset.t === tab) return; tab = b.dataset.t; store.set('channels.tab', tab); close(); render(); };
  document.querySelectorAll('.sic').forEach((x) => { x.innerHTML = I.search; });
  $('iq').oninput = () => { INV.q = $('iq').value.trim().toLowerCase(); render(); };
  $('iType').onchange = () => { INV.type = $('iType').value; render(); };
  $('iStatus').onchange = () => { INV.status = $('iStatus').value; render(); };
  $('iGeo').onchange = () => { INV.geo = $('iGeo').value; render(); };
  $('iProv').onchange = () => { INV.provider = $('iProv').value; render(); };
  $('iAdd').onclick = () => { sel = null; invSel = { kind: 'new' }; openInv(); };
  $('gq').oninput = () => { GF.q = $('gq').value.trim().toLowerCase(); render(); };
  $('gCountry').onchange = () => { GF.country = $('gCountry').value; render(); };
  $('gCat').onchange = () => { GF.cat = $('gCat').value; render(); };
  $('gAuto').onclick = () => {
    const r = ((data.gaps && data.gaps.requirements) || []).find((x) => x.id === gapReq); if (!r) return;
    twoStep($('gAuto'), `Bind free ${TYPE_NAME[r.type] || r.type} to up to ${r.missing_count} ${r.scope}s?`, async () => {
      $('gAuto').disabled = true;
      try { const res = await mutate('inventory_autobind', { requirement_id: r.id }); toast(`Bound ${res.bound} · still missing ${res.unassigned_count}${r.geo_match && res.unassigned_count ? ' (no free item in their country)' : ''}`); } catch { /* toasted */ }
      $('gAuto').disabled = false;
    });
  };
  $('viewSeg').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v; store.set('channels.view2', view); render(); if (sel) markSel(); };
  $('q').oninput = () => { filter.q = $('q').value.trim().toLowerCase(); render(); };
  $('fStage').onchange = () => { filter.stage = $('fStage').value; render(); };
  $('fPlat').onchange = () => { filter.platform = $('fPlat').value; render(); };
  $('fCat').onchange = () => { filter.cat = $('fCat').value; render(); };
  $('fCountry').onchange = () => { filter.country = $('fCountry').value; render(); };
  $('fVal').onchange = () => { filter.val = $('fVal').value; render(); };
  $('fArch').onchange = () => { filter.arch = $('fArch').value; render(); };
  $('fRole').onchange = () => { filter.role = $('fRole').value; render(); };
  $('fSort').onchange = () => { filter.sort = $('fSort').value; render(); };
  $('refresh').onclick = () => refresh(true);
  $('reveal').onclick = () => aa('fs.reveal', { path: '' }).catch((e) => { $('upd').textContent = e.message; });
  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1)); let m;
    if ((m = /^tab=(channels|inventory|gaps)$/.exec(h))) { tab = m[1]; store.set('channels.tab', tab); close(); render(); return; }
    if (/^(p|c|stage)=/.test(h) && tab !== 'channels') { tab = 'channels'; render(); }
    if ((m = /^p=(.+)$/.exec(h))) { sel = { kind: 'p', id: m[1] }; openSel(); }
    else if ((m = /^c=([^:]+):(.+)$/.exec(h))) { sel = { kind: 'c', id: m[1], platform: m[2] }; openSel(); }
    else if ((m = /^stage=(.+)$/.exec(h)) && CH.STAGES.includes(m[1])) { filter.stage = m[1]; render(); }
  }
  window.addEventListener('hashchange', fromHash);
  setInterval(() => { if (!document.hidden) refresh(); }, 4000);
  setInterval(tick, 1000);
  window.addEventListener('focus', () => refresh());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  refresh(true).then(fromHash);
</script>
</body>
</html>
